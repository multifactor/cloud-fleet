# claude-fleet: the dedicated tmux server's configuration.
#
# Loaded with `-f` on the fleet's own socket (`-L <terminal.tmux.socket>`), so the operator's own
# tmux config, prefix and key bindings never apply to the fleet, and `kill-server` on that socket
# tears down exactly the fleet. Everything here is valid on tmux 3.0, the floor the backend probes.

# The fleet's server outlives its last session. tmux's default is `exit-empty on`: destroy the last
# session and the server exits by itself, moments later. For an ordinary tmux that is tidy; for a
# fleet it is a race with every relaunch. `fleet relaunch` kills a session and spawns a fresh one into
# the same worktree, and if that session was the last one, the server is shutting down in between —
# the next call is answered "lost server" or starts a SECOND server, and a kill that has to re-query
# to prove the pane gone cannot get an answer at all. It also makes `fleet down`'s `kill-server`
# meaningless, and leaves a fleet that killed its last session unable to be re-entered by `fleet up`,
# which is supposed to ADOPT the running server rather than create a rival.
#
# The server is on the fleet's own socket, so nothing else is kept alive by this: `fleet down` ends it
# explicitly, and that is the only thing that should.
set -g exit-empty off

# A crashed agent keeps its pane and its scrollback instead of vanishing with the window: the
# scrollback is the only evidence of WHY it died. (The backend also sets this per window at spawn,
# so it holds even when the server was started with another config.)
set -g remain-on-exit on

# The window name is the session's title, set by the launcher. A program renaming its own window
# would hide which session is which across a screen of twenty.
set -g allow-rename off
set -g automatic-rename off

# An agent's terminal output is what the operator reads after a crash; the default 2000 lines is
# gone in minutes.
set -g history-limit 20000

# Escape is a key the agent's UI uses on its own; the default 500 ms wait for a following key makes
# every Escape feel stuck.
set -sg escape-time 10

# 256 colours for the agent's UI. screen-256color exists on every macOS and Linux terminfo database;
# tmux-256color does not (older macOS ncurses), and a missing entry leaves the pane monochrome or
# worse, "unknown terminal".
set -g default-terminal "screen-256color"

# One status bar for the whole fleet. Each window renders its @fleet_state, which the backend's
# setStatus() writes and list() reads back: red = working, green = ready, amber = blocked, grey =
# not painted yet. A dead pane (remain-on-exit) is marked so a crashed session is visible without
# opening it. Styles use spaces, not commas: a comma inside #{?...} splits the conditional.
set -g status on
set -g status-interval 2
set -g status-left-length 20
set -g status-left "#[bold] fleet:#S "
set -g status-right " %H:%M "
setw -g window-status-separator " "
setw -g window-status-format "#{?#{==:#{@fleet_state},working},#[fg=white bg=colour160],#{?#{==:#{@fleet_state},ready},#[fg=white bg=colour28],#{?#{==:#{@fleet_state},blocked},#[fg=black bg=colour214],#[fg=colour245]}}} #{?@fleet_id,#{@fleet_id},#I}:#W#{?pane_dead, (dead),} #[default]"
setw -g window-status-current-format "#{?#{==:#{@fleet_state},working},#[fg=white bg=colour160 bold],#{?#{==:#{@fleet_state},ready},#[fg=white bg=colour28 bold],#{?#{==:#{@fleet_state},blocked},#[fg=black bg=colour214 bold],#[fg=white bold]}}} #{?@fleet_id,#{@fleet_id},#I}:#W#{?pane_dead, (dead),} #[default]"
